<!DOCTYPE html>
<html lang="ch">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="./src/assets/images/favicon.ico"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>玄学不玄</title>
    <style>
        em {
            color: #f00;
            font-style: normal ;
        }

        /*滚动条样式*/
        ::-webkit-scrollbar {
            width: 0.25rem;
            height: 0.25rem;
            background-image: linear-gradient(135deg, #eee 0%, #ddd 72%, #ccc 100%);
        }

        /*定义滚动条滑块*/
        ::-webkit-scrollbar-thumb {
            background-color: #98dba1;
        }

    </style>
    <script>
        /*
         * 首屏防闪烁。
         *
         * 主题偏好存在 localStorage 里，而 Vue 要等 JS 加载完才挂载 ——
         * 如果只在 App.vue 的 onMounted 里应用主题，选了暗色的用户每次刷新
         * 都会先看到一帧亮色。这个内联脚本在解析阶段就把 html.dark 写上去，
         * 早于首帧绘制。
         *
         * 键名与 src/utils/theme.ts 的 THEME_STORAGE_KEY 必须一致。
         * 这里刻意不去解析 pinia 持久化的 theme_store —— 那是插件自己的格式
         * （可能是 {theme:true}，也可能是 {state:{theme:true}}），
         * 把它当契约会在插件升级时悄悄失效。
         */
        (function () {
            function paintTheme() {
                var dark = false;
                try {
                    dark = localStorage.getItem('yuanqi.theme') === 'dark';
                } catch (e) {
                    // 隐私模式下读不到，按明亮处理即可
                }
                if (!dark) return;
                var root = document.documentElement;
                root.classList.add('dark');
                root.style.colorScheme = 'dark';
                var app = document.getElementById('app');
                if (app) app.setAttribute('data-theme', 'dark');
            }

            paintTheme();
            // <head> 阶段还没有 #app，等 DOM 建好再补一次
            document.addEventListener('DOMContentLoaded', paintTheme);
        })();
    </script>
</head>
<body>

<!--
  右上角原来挂着一个 80×80 的 GitHub 角标（position:absolute; top:0; right:0）。
  它压住了 Header 的最右端，逼得主题开关要留 96px 的 margin-right 死区来躲它，
  自动化点击也常误点到角标上。现已移除，GitHub 入口改到导航右侧的图标簇里
  （见 components/Header.vue 的 .github-btn），位置可控、也不再和别的东西抢空间。
-->

<div id="app" data-theme="light"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
