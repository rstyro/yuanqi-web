name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # 如果是 master 分支，请改为 master

# 设置权限，允许写入仓库内容
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v3

      - name: 设置 Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22' # 可根据需要调整
          cache: 'npm'

      - name: 安装依赖
        run: npm install

      - name: 构建项目
        run: npm run build

      - name: 部署到 GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # 部署到的分支
          folder: dist # Vite 默认打包目录
          token: ${{ secrets.GITHUB_TOKEN }} # 使用内置 token